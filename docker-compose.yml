services:
  db:
    image: postgres:16-alpine
    container_name: cloudlab_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloudlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudlab_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cloudlab_edu}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudlab} -d ${POSTGRES_DB:-cloudlab_edu}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cloudlab-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudlab_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-cloudlab}:${POSTGRES_PASSWORD:-cloudlab_secret_2026}@db:5432/${POSTGRES_DB:-cloudlab_edu}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-cloudlab_edu_super_secret_jwt_key_2026}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: 10
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - cloudlab-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    container_name: cloudlab_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cloudlab-net

volumes:
  postgres_data:
  uploads_data:

networks:
  cloudlab-net:
    driver: bridge
